name: Analyze MLB Moneyline Edge

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2025-03-28'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2025-09-28'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Analyze moneyline edge
      run: |
        python analyze_mlb_moneyline_edge.py "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"
