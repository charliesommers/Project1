name: Compare MLB Prices - Greg vs Vegas

on:
  workflow_dispatch:
    inputs:
      gregs_sheet_url:
        description: 'Google Sheets URL for Greg''s MLB picks'
        required: true
        default: 'https://docs.google.com/spreadsheets/d/1dfBdsjWDp0eK20VXDOY6MC5ArWvcVCMF/export?format=xlsx'
      sheet_name:
        description: 'Optional: specific sheet name/date (e.g., "11/1/25"). Leave empty to parse all sheets.'
        required: false
        default: ''

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Greg's sheet
      run: |
        mkdir -p data
        echo "Downloading Greg's MLB data..."
        curl -L \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          "${{ github.event.inputs.gregs_sheet_url }}" \
          -o data/gregs_mlb.xlsx

        echo "Download complete. Checking file..."
        file data/gregs_mlb.xlsx
        ls -lh data/gregs_mlb.xlsx

        # Check if it's actually an Excel file
        if ! file data/gregs_mlb.xlsx | grep -q "Microsoft Excel\|Zip archive"; then
          echo "ERROR: Downloaded file is not an Excel file!"
          echo "Content of downloaded file (first 500 chars):"
          head -c 500 data/gregs_mlb.xlsx
          exit 1
        fi

    - name: Compare prices
      run: |
        if [ -n "${{ github.event.inputs.sheet_name }}" ]; then
          python compare_greg_to_vegas.py \
            --gregs-file data/gregs_mlb.xlsx \
            --sheet-name "${{ github.event.inputs.sheet_name }}"
        else
          python compare_greg_to_vegas.py \
            --gregs-file data/gregs_mlb.xlsx
        fi
