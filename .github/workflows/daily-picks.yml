name: Daily CBB Picks Discord

on:
  schedule:
    # Runs at 11:30 UTC (5:30 AM CST) every day
    # Updated to ensure scheduled runs are enabled
    - cron: '30 11 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  send-picks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Send picks to Discord
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TZ: America/Chicago
      run: |
        test -n "$DISCORD_WEBHOOK_URL" || { echo "Missing DISCORD_WEBHOOK_URL secret"; exit 1; }
        python email_picks_gsheets.py
