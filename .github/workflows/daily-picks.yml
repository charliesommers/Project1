name: Daily CBB Picks Discord

on:
  schedule:
    # 6 AM Central, following daylight saving time.
    - cron: '0 6 * * *'
      timezone: America/Chicago
  # Runs once when this workflow is updated, and supports phone-app reruns.
  push:
    paths:
      - '.github/workflows/daily-picks.yml'
  workflow_dispatch:  # Before 6 PM CT: today; from 6 PM CT: tomorrow

jobs:
  send-picks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Send picks to Discord
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TZ: America/Chicago
      run: |
        test -n "$DISCORD_WEBHOOK_URL" || { echo "Missing DISCORD_WEBHOOK_URL secret"; exit 1; }
        python email_picks_gsheets.py
