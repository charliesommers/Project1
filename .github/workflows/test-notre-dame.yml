name: Test FanDuel report and Discord
# Validate compact season-tab date parsing with a live preview.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-notre-dame.yml'

permissions:
  contents: read

jobs:
  preview-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send FanDuel-only preview
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: America/Chicago
        run: python email_picks_gsheets.py
