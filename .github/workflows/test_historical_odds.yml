name: Test Historical Odds Scraping

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test free historical odds sources
      run: |
        echo "Testing if we can access free historical odds sources..."
        python test_historical_odds.py

    - name: Test Covers.com scraper
      run: |
        echo "Testing Covers.com scraper implementation..."
        python historical_odds_scraper.py

    - name: Summary
      run: |
        echo ""
        echo "========================================"
        echo "If the above tests show accessible data, we can backtest Greg's picks for free!"
        echo "If not, we'll need to use The Odds API credits or skip the backtest."
        echo "========================================"
